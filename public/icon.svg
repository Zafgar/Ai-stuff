  <!-- Sword tip -->
  <polygon points="256,48 240,90 272,90" fill="#e8c96d"/>
  <!-- Cross guard -->
  <rect x="176" y="296" width="160" height="24" rx="8" fill="#c9a84c"/>
  <!-- Grip -->
